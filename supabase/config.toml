# Payment webhooks are called by Xendit/PayPal, not by a Supabase user JWT.
[functions.paypal-webhook]
verify_jwt = false

[functions.xendit-webhook]
verify_jwt = false

# PayPal return completion is called from the browser, including guests.
[functions.complete-paypal-checkout]
verify_jwt = false

# Guests poll Xendit/order status after invoice redirect without a user JWT.
[functions.order-payment-status]
verify_jwt = false

# Called by Supabase Cron with the private worker secret.
[functions.process-order-email-events]
verify_jwt = false
